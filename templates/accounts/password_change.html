<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تغيير كلمة المرور</title></head>
<body>
  <h2>لازم تغيّر كلمة المرور المؤقتة</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">حفظ</button>
  </form>
  <form method="post" action="{% url 'accounts:staff_logout' %}">
    {% csrf_token %}
    <button type="submit">تسجيل الخروج</button>
  </form>
</body>
</html>
